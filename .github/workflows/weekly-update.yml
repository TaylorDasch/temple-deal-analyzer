name: Weekly Deal Analysis

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run deal analyzer
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: npm run analyze
      
      - name: Commit and push changes
        run: |
          git config user.name "Deal Analyzer Bot"
          git config user.email "bot@templetxhomes.net"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update deals: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
